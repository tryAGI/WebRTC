name: Authentication rejection under valid media load
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  load:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: dotnet build src/tests/WebRTC.Performance -c Release -warnaserror
      - name: Fresh-process authentication bursts and real drop control
        shell: bash
        run: |
          for repetition in 1 2 3; do
            dotnet src/tests/WebRTC.Performance/bin/Release/net10.0/WebRTC.Performance.dll --suite auth-load > "load-$repetition.csv"
            python3 scripts/check-authentication-load.py "load-$repetition.csv" --output "proof-$repetition.json"
          done
          dotnet src/tests/WebRTC.Performance/bin/Release/net10.0/WebRTC.Performance.dll --suite auth-load-control > control.csv
          python3 scripts/check-authentication-load.py control.csv --control --output control-proof.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: authentication-load-${{ matrix.os }}-${{ github.sha }}
          path: |
            load-*.csv
            proof-*.json
            control.csv
            control-proof.json
          if-no-files-found: error
          retention-days: 30
