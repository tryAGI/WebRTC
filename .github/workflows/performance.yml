name: Performance baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crypto:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/tests/WebRTC.Performance -c Release
      - name: Authenticated SRTP roundtrip baseline
        shell: bash
        run: dotnet run --project src/tests/WebRTC.Performance -c Release --no-build > performance.csv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: srtp-${{ matrix.os }}-${{ github.sha }}
          path: performance.csv
          retention-days: 30
