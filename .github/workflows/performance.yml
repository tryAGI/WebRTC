name: Performance baseline
on:
  workflow_dispatch:
    inputs:
      long_retention:
        description: Run longer fresh-process memory controls (already required for before/after runtime changes)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  crypto:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/tests/WebRTC.Performance -c Release
      - name: Retain hardware metadata
        shell: bash
        run: |
          if command -v lscpu >/dev/null; then lscpu > hardware.txt
          elif command -v sysctl >/dev/null; then sysctl -n machdep.cpu.brand_string > hardware.txt
          else printenv PROCESSOR_IDENTIFIER > hardware.txt; fi
      - name: Authenticated SRTP roundtrip baseline
        shell: bash
        run: dotnet run --project src/tests/WebRTC.Performance -c Release --no-build > performance.csv
      - name: Packet parsing and framing baseline
        shell: bash
        run: dotnet run --project src/tests/WebRTC.Performance -c Release --no-build -- --suite packets > packets.csv
      - name: Exact-zero allocation contracts and real allocation control
        shell: bash
        run: |
          python3 scripts/check-performance-budgets.py . --zero-only --output exact-zero-proof.json
          TRYAGI_BENCHMARK_ALLOCATION_CONTROL=1 dotnet run --project src/tests/WebRTC.Performance -c Release --no-build > allocation-control.csv
          python3 scripts/check-performance-budgets.py --verify-positive-control allocation-control.csv --output allocation-control-proof.json
      - name: Bounded loopback media pipeline
        shell: bash
        run: dotnet run --project src/tests/WebRTC.Performance -c Release --no-build -- --suite media > media.csv
      - name: Trusted-input video reassembly baseline
        shell: bash
        run: dotnet run --project src/tests/WebRTC.Performance -c Release --no-build -- --suite video > video.csv
      - name: SCTP data-channel pipeline baseline
        shell: bash
        run: dotnet run --project src/tests/WebRTC.Performance -c Release --no-build -- --suite channels > channels.csv
      - name: New-connection and fresh SRTP generation costs
        shell: bash
        run: dotnet run --project src/tests/WebRTC.Performance -c Release --no-build -- --suite cold > cold.csv
      - name: Bidirectional encoded-audio pipeline
        shell: bash
        run: dotnet run --project src/tests/WebRTC.Performance -c Release --no-build -- --suite audio > audio.csv
      - name: Bounded repeated peer lifetime and memory soak
        shell: bash
        run: dotnet run --project src/tests/WebRTC.Performance -c Release --no-build -- --suite soak > soak.csv
      - name: Idle transport maintenance baseline
        shell: bash
        run: dotnet run --project src/tests/WebRTC.Performance -c Release --no-build -- --suite idle > idle.csv
      - name: Repeated data-channel idle cohorts
        shell: bash
        run: |
          for repetition in 1 2 3; do
            dotnet run --project src/tests/WebRTC.Performance -c Release --no-build -- --suite idle-sctp > "idle-sctp-$repetition.csv"
          done
      - name: Reviewed idle allocation budgets
        shell: bash
        run: python3 scripts/check-performance-budgets.py . --output budget-proof.json
      - name: Isolated longer peer retention controls
        if: ${{ inputs.long_retention }}
        shell: bash
        run: |
          for mode in empty_control identity_only peer_audio peer_open; do
            for trace in 0 1; do
              if [[ "$trace" == 1 && ( "$mode" == empty_control || "$mode" == identity_only ) ]]; then continue; fi
              TRYAGI_RETENTION_MODE="$mode" TRYAGI_RETENTION_TRACE="$trace" dotnet run --project src/tests/WebRTC.Performance -c Release --no-build -- --suite retention > "retention-$mode-$trace.csv"
            done
          done
      - name: Native identity construction attribution
        shell: bash
        run: dotnet run --project src/tests/WebRTC.Performance -c Release --no-build -- --suite identity > identity.csv
      - name: Process-isolated native identity retention controls
        shell: bash
        run: |
          for mode in empty_control legacy_private_certificate public_only_certificate runtime_identity; do
            TRYAGI_NATIVE_MODE="$mode" DOTNET_TieredCompilation=0 dotnet run --project src/tests/WebRTC.Performance -c Release --no-build -- --suite native > "native-$mode.csv"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: srtp-${{ matrix.os }}-${{ github.sha }}
          path: |
            performance.csv
            packets.csv
            media.csv
            video.csv
            channels.csv
            cold.csv
            audio.csv
            soak.csv
            idle.csv
            idle-sctp-*.csv
            retention-*.csv
            identity.csv
            native-*.csv
            hardware.txt
            exact-zero-proof.json
            allocation-control.csv
            allocation-control-proof.json
            budget-proof.json
          retention-days: 30
