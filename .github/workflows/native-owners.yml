name: Native allocation owners and quiescence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owners:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: dotnet build src/tests/WebRTC.Performance -c Release -warnaserror
      - name: Matched instrumented controls on one runner
        shell: bash
        run: |
          for repetition in 1 2 3; do
            modes=(empty_control peer_open)
            if [ "$repetition" = 2 ]; then modes=(peer_open empty_control); fi
            for mode in "${modes[@]}"; do
              python3 scripts/profile-retention-macos.py src/tests/WebRTC.Performance/bin/Release/net10.0/WebRTC.Performance.dll "owners/$mode/process-$repetition" --mode "$mode" --trace 0 --waves 64 --tiering-off --owners
            done
          done
          python3 scripts/summarize-native-owners.py owners --output owners/summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-owners-${{ github.sha }}
          path: |
            owners/*/*/profile.json
            owners/*/*/retention.csv
            owners/summary.json
          if-no-files-found: error
          retention-days: 30
