name: Physical scheduling diagnostic artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          mkdir -p artifacts/scheduling
          clang -O2 -Wall -Wextra -Werror tests/diagnostics/NativeTimers/scheduling.c -o artifacts/scheduling/scheduling
          clang -O2 -Wall -Wextra -Werror tests/diagnostics/NativeTimers/timers.c -o artifacts/scheduling/native-timers
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('artifacts/scheduling')
          (root/'manifest.json').write_text(json.dumps(dict(source=os.environ['GITHUB_SHA'],sha256={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir()}),indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: physical-scheduling-${{ github.sha }}
          path: artifacts/scheduling
          retention-days: 30
          if-no-files-found: error
