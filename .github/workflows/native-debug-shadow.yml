name: Verify code-identical native debug input
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  symbols:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: dotnet restore src/tests/WebRTC.AotSmoke -r osx-arm64 -p:PublishAot=true -p:RuntimeFrameworkVersion=10.0.13 -warnaserror
      - name: Require byte-equivalent loaded code, relocations and symbols
        run: python3 scripts/prepare-native-debug-shadow.py "$HOME/.nuget/packages/microsoft.netcore.app.runtime.nativeaot.osx-arm64/10.0.13/runtimes/osx-arm64/native/libSystem.Security.Cryptography.Native.Apple.a" "$GITHUB_WORKSPACE/artifacts/debug-input"
      - name: Strict publish using original framework and verified debug input
        run: |
          options="$(cat artifacts/debug-input/dsym-options.txt)"
          dotnet publish src/tests/WebRTC.AotSmoke -c Release -r osx-arm64 -p:PublishAot=true -p:RuntimeFrameworkVersion=10.0.13 -warnaserror "-p:DsymUtilOptions=$options" -o artifacts/smoke
      - name: Verify usable native DWARF
        run: |
          xcrun dwarfdump --verify artifacts/smoke/WebRTC.AotSmoke.dSYM
          xcrun dwarfdump --debug-info --regex --name AesGcmDecrypt artifacts/smoke/WebRTC.AotSmoke.dSYM > artifacts/crypto-symbols.txt
          xcrun dwarfdump --debug-info --regex --name ProcessDatagram artifacts/smoke/WebRTC.AotSmoke.dSYM > artifacts/managed-symbols.txt
          python3 - <<'PY'
          from pathlib import Path
          for kind in ('crypto', 'managed'):
              text = Path('artifacts/' + kind + '-symbols.txt').read_text()
              if 'DW_TAG_subprogram' not in text or not any(name in text for name in ('DW_AT_low_pc', 'DW_AT_ranges')):
                  raise SystemExit('Usable native function ranges missing: ' + kind)
          PY
      - name: Execute full rooted native smoke
        run: artifacts/smoke/WebRTC.AotSmoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-debug-input-proof-${{ github.sha }}
          path: artifacts/debug-input/*proof.json
          if-no-files-found: error
          retention-days: 30
