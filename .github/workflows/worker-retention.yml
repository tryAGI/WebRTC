name: Worker retirement and tracing counterfactuals
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workers:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: dotnet build src/tests/WebRTC.Performance -c Release -warnaserror
      - name: Twelve fresh matched child processes
        shell: bash
        run: |
          for repetition in 1 2 3; do
            controls=(plain-0 traced-24 traced-0 plain-24)
            if [ "$repetition" = 2 ]; then controls=(plain-24 traced-0 traced-24 plain-0); fi
            for control in "${controls[@]}"; do
              options=()
              if [[ "$control" == traced-* ]]; then options+=(--owners); fi
              python3 scripts/profile-retention-macos.py src/tests/WebRTC.Performance/bin/Release/net10.0/WebRTC.Performance.dll "worker-controls/$control/process-$repetition" --mode peer_open --trace 0 --waves 24 --tiering-off --quiescence --worker-minimum "${control##*-}" "${options[@]}"
            done
          done
          python3 scripts/summarize-worker-retention.py worker-controls --output worker-controls/summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: worker-retention-${{ github.sha }}
          path: |
            worker-controls/*/*/profile.json
            worker-controls/*/*/retention.csv
            worker-controls/summary.json
          if-no-files-found: error
          retention-days: 30
