name: Bug report
description: Report a reproducible protocol, interoperability or API problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'For vulnerabilities, use the private reporting link in SECURITY.md. Remove credentials, private SDP addresses and provider data from reports.'
  - type: input
    id: version
    attributes:
      label: Package version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, .NET version and independent peer/version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Prefer a local peer; include commands and relevant non-secret options.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include bounded counters or logs; no tokens, credentials or private media.
